<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://theoverridden.github.io/The-Seventh-Ember/">
  <link rel="canonical" href="https://theoverridden.github.io/The-Seventh-Ember/">
  <title>The Seventh Ember</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #f4e7cf;
      background: radial-gradient(circle at center, #2b160f, #070608 32rem);
    }
    main { padding: 3rem; text-align: center; }
    p { letter-spacing: .12em; text-transform: uppercase; }
    a { color: #f3b36e; text-underline-offset: .3em; }
  </style>
  <script>
    const destination = new URL("https://theoverridden.github.io/The-Seventh-Ember/");
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <main>
    <p>VoidFall is now The Seventh Ember.</p>
    <a href="https://theoverridden.github.io/The-Seventh-Ember/">Continue to the game</a>
  </main>
</body>
</html>
